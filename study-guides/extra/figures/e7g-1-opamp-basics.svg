<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="900" height="380" rx="10" fill="#fff" stroke="#ccc"/>
<text x="450.0" y="28" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">Op-amp characteristics: very high input Z, very low output Z, and gain-bandwidth</text>
<polygon points="90.0,130.0 90.0,250.0 210.0,190.0" fill="#dce9fb" stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="100" y="168" font-size="18" text-anchor="start" font-weight="bold" fill="#222">−</text>
<text x="100" y="228" font-size="18" text-anchor="start" font-weight="bold" fill="#222">+</text>
<line x1="40.0" y1="160.0" x2="90.0" y2="160.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="40.0" y1="220.0" x2="90.0" y2="220.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<line x1="210.0" y1="190.0" x2="260.0" y2="190.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<text x="175" y="60" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">Op-amp</text>
<text x="175" y="78" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">high-gain, direct-coupled, differential</text>
<text x="36" y="118" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1a6fd4">very high</text>
<text x="36" y="134" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1a6fd4">input Z</text>
<text x="260" y="162" font-size="12.5" text-anchor="end" font-weight="bold" fill="#2e8b57">very low</text>
<text x="260" y="178" font-size="12.5" text-anchor="end" font-weight="bold" fill="#2e8b57">output Z</text>
<text x="175" y="290" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">barely loads its source,</text>
<text x="175" y="307" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">barely sags under its load</text>
<line x1="330.0" y1="50.0" x2="330.0" y2="365.0" stroke="#e5e5e5" stroke-width="1" stroke-linecap="round"/>
<text x="500" y="60" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">Gain-bandwidth</text>
<text x="500" y="78" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">frequency where open-loop gain = 1</text>
<line x1="390.0" y1="100.0" x2="390.0" y2="290.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
<line x1="390.0" y1="290.0" x2="610.0" y2="290.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
<text x="500.0" y="314" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">frequency (log) →</text>
<text transform="rotate(-90 376 195.0)" x="376" y="195.0" font-size="12.5" text-anchor="middle" fill="#222">open-loop gain (dB)</text>
<polyline points="390.0,115.9 393.7,116.0 397.3,116.0 401.0,116.2 404.7,116.4 408.3,116.8 412.0,117.4 415.7,118.3 419.3,119.6 423.0,121.4 426.7,123.7 430.3,126.5 434.0,129.5 437.7,132.8 441.3,136.3 445.0,139.8 448.7,143.4 452.3,147.0 456.0,150.7 459.7,154.4 463.3,158.1 467.0,161.8 470.7,165.4 474.3,169.1 478.0,172.8 481.7,176.5 485.3,180.2 489.0,183.9 492.7,187.6 496.3,191.3 500.0,195.0 503.7,198.7 507.3,202.4 511.0,206.1 514.7,209.8 518.3,213.5 522.0,217.2 525.7,220.9 529.3,224.6 533.0,228.3 536.7,231.9 540.3,235.6 544.0,239.3 547.7,243.0 551.3,246.7 555.0,250.4 558.7,254.1 562.3,257.8 566.0,261.5 569.7,265.2 573.3,268.9 577.0,272.6 580.7,276.3 584.3,280.0 588.0,283.7 591.7,287.4 595.3,291.1 599.0,294.8 602.7,298.4 606.3,302.1 610.0,305.8" fill="none" stroke="#1a6fd4" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="390.0" y1="274.2" x2="610.0" y2="274.2" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="578.6" y1="274.2" x2="578.6" y2="290.0" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round"/>
<circle cx="578.6" cy="274.2" r="4.5" fill="#d1342f" stroke="none" stroke-width="1.5"/>
<text x="398" y="238" font-size="12.5" text-anchor="start" font-weight="bold" fill="#d1342f">red dot: unity gain</text>
<text x="398" y="254" font-size="12.5" text-anchor="start" font-weight="bold" fill="#d1342f">= gain-bandwidth</text>
<text x="500" y="335" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">an ideal op-amp's gain would not vary</text>
<text x="500" y="352" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">with frequency; real ones roll off</text>
<line x1="640.0" y1="50.0" x2="640.0" y2="365.0" stroke="#e5e5e5" stroke-width="1" stroke-linecap="round"/>
<text x="780" y="60" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">Input offset voltage</text>
<text x="780" y="78" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">needed to bring output to zero</text>
<line x1="690.0" y1="195.0" x2="870.0" y2="195.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
<line x1="780.0" y1="100.0" x2="780.0" y2="290.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
<text x="870" y="255.0" font-size="12.5" text-anchor="end" font-weight="normal" fill="#222">differential input →</text>
<text x="786.0" y="108" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">open-loop output ↑</text>
<polyline points="695.0,275.0 698.0,275.0 701.0,275.0 704.0,275.0 707.0,275.0 710.0,275.0 713.0,275.0 716.0,275.0 719.0,275.0 722.0,275.0 725.0,275.0 728.0,275.0 731.0,275.0 734.0,275.0 737.0,275.0 740.0,275.0 743.0,275.0 746.0,274.9 749.0,274.9 752.0,274.9 755.0,274.8 758.0,274.7 761.0,274.5 764.0,274.3 767.0,273.9 770.0,273.4 773.0,272.5 776.0,271.2 779.0,269.2 782.0,266.3 785.0,262.0 788.0,255.9 791.0,247.5 794.0,236.3 797.0,222.4 800.0,206.4 803.0,189.3 806.0,172.7 809.0,158.0 812.0,145.9 815.0,136.6 818.0,129.8 821.0,124.9 824.0,121.6 827.0,119.4 830.0,117.9 833.0,116.9 836.0,116.2 839.0,115.8 842.0,115.5 845.0,115.3 848.0,115.2 851.0,115.1 854.0,115.1 857.0,115.1 860.0,115.0 863.0,115.0" fill="none" stroke="#1a6fd4" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="802.0" cy="195.0" r="4.5" fill="#d1342f" stroke="none" stroke-width="1.5"/>
<line x1="780.0" y1="217.0" x2="802.0" y2="217.0" stroke="#d1342f" stroke-width="2" stroke-linecap="round"/>
<text x="791.0" y="235.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#d1342f">Vos</text>
<text x="780" y="335" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">a real op-amp isn't perfectly balanced:</text>
<text x="780" y="352" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">output = 0 only at input = Vos</text>
</svg>
