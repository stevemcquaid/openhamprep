<text x="830" y="210" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">laminated</text>
<text x="795" y="252" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">thin layers → small eddy</text>
<text x="795" y="268" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">loops → less power loss</text>
<text x="795" y="306" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1a6fd4">Ferrite: higher μ,</text>
<text x="795" y="322" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1a6fd4">fewer turns</text>
