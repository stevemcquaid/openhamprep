<text x="337" y="338" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">brass is non-magnetic: its eddy</text>
<text x="337" y="354" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">currents oppose the coil's field</text>
