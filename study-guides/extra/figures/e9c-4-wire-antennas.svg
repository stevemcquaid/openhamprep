<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="900" height="400" rx="10" fill="#fff" stroke="#ccc"/>
<text x="450" y="28" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">Named wire antennas (side/top view, schematic)</text>
<text x="150" y="72" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">Folded dipole</text>
<text x="150" y="90" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">center feed ≈ 300 Ω (plain dipole ≈ 72 Ω)</text>
<line x1="40.0" y1="140.0" x2="260.0" y2="140.0" stroke="#d1342f" stroke-width="3" stroke-linecap="round"/>
<line x1="40.0" y1="160.0" x2="260.0" y2="160.0" stroke="#d1342f" stroke-width="3" stroke-linecap="round"/>
