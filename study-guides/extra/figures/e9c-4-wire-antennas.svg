<line x1="620.0" y1="317.0" x2="620.0" y2="333.0" stroke="#999" stroke-width="1" stroke-dasharray="2 2" stroke-linecap="round"/>
<text x="620" y="311" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">center</text>
</svg>
