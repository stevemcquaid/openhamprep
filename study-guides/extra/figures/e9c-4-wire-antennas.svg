<text x="456" y="179" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">balun</text>
<text x="454" y="200" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">coax to radio</text>
<text x="730" y="72" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">Zepp</text>
<text x="730" y="90" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">end-fed half-wave dipole</text>
<line x1="630.0" y1="140.0" x2="840.0" y2="140.0" stroke="#d1342f" stroke-width="3" stroke-linecap="round"/>
<line x1="630.0" y1="140.0" x2="630.0" y2="192.0" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<circle cx="630" cy="140" r="5" fill="#222"/>
<text x="636" y="210" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">feed at the end</text>
<text x="745.0" y="130" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">½ λ</text>
<text x="290" y="257" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">Extended double Zepp</text>
<text x="290" y="275" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">center-fed, 1.25 λ total (two 5⁄8 λ legs)</text>
<line x1="160.0" y1="325.0" x2="420.0" y2="325.0" stroke="#d1342f" stroke-width="3" stroke-linecap="round"/>
<circle cx="290" cy="325" r="5" fill="#222"/>
<text x="225.0" y="315" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">5⁄8 λ</text>
<text x="355.0" y="315" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">5⁄8 λ</text>
<line x1="290.0" y1="325.0" x2="290.0" y2="365.0" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<text x="298" y="361" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">feed</text>
<text x="620" y="257" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">Off-center-fed dipole (OCFD)</text>
<text x="620" y="275" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">similar feed point Z on several bands</text>
<line x1="490.0" y1="325.0" x2="750.0" y2="325.0" stroke="#d1342f" stroke-width="3" stroke-linecap="round"/>
