<text x="440" y="72" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">G5RV</text>
<text x="440" y="90" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">center-fed through open-wire line</text>
<line x1="320.0" y1="130.0" x2="560.0" y2="130.0" stroke="#d1342f" stroke-width="3" stroke-linecap="round"/>
