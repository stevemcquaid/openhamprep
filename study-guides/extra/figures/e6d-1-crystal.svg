<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="900" height="340" rx="10" fill="#fff" stroke="#ccc"/>
<text x="450.0" y="28" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">Quartz crystal: piezoelectric both ways; equivalent circuit = series RLC in parallel with shunt C</text>
<line x1="20.0" y1="170.0" x2="68.0" y2="170.0" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="112.0" y1="170.0" x2="160.0" y2="170.0" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="68.0" y1="142.0" x2="68.0" y2="198.0" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<line x1="112.0" y1="142.0" x2="112.0" y2="198.0" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<rect x="78.0" y="148.0" width="24.0" height="44.0" rx="0" fill="#f6f0d8" stroke="#222" stroke-width="1.5"/>
<text x="90" y="112" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">crystal symbol</text>
<text x="90" y="245" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">quartz slab between</text>
<text x="90" y="262" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">two electrodes</text>
<line x1="300.0" y1="110.0" x2="300.0" y2="245.0" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="600.0" y1="110.0" x2="600.0" y2="245.0" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="260.0" y1="178.0" x2="300.0" y2="178.0" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="600.0" y1="178.0" x2="640.0" y2="178.0" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<circle cx="260.0" cy="178.0" r="4" fill="#222" stroke="none" stroke-width="1.5"/>
<circle cx="640.0" cy="178.0" r="4" fill="#222" stroke="none" stroke-width="1.5"/>
<circle cx="300.0" cy="178.0" r="3" fill="#222" stroke="none" stroke-width="1.5"/>
<circle cx="600.0" cy="178.0" r="3" fill="#222" stroke="none" stroke-width="1.5"/>
<polyline points="300.0,110.0 306.0,110.0 311.7,118.0 323.0,102.0 334.3,118.0 345.7,102.0 357.0,118.0 368.3,102.0 374.0,110.0 380.0,110.0" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 380 110 L 386 110 A 12.2 12.2 0 0 1 410.5 110 A 12.2 12.2 0 0 1 435.0 110 A 12.2 12.2 0 0 1 459.5 110 A 12.2 12.2 0 0 1 484.0 110 L 490 110" fill="none" stroke="#222" stroke-width="2"/>
<line x1="490.0" y1="110.0" x2="505.0" y2="110.0" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="505.0" y1="110.0" x2="515.5" y2="110.0" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="524.5" y1="110.0" x2="600.0" y2="110.0" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="515.5" y1="101.0" x2="515.5" y2="119.0" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<line x1="524.5" y1="101.0" x2="524.5" y2="119.0" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<text x="340" y="94" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">R1</text>
<text x="435" y="86" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">L1</text>
<text x="520" y="86" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">C1</text>
<line x1="300.0" y1="245.0" x2="445.5" y2="245.0" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="454.5" y1="245.0" x2="600.0" y2="245.0" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<line x1="445.5" y1="236.0" x2="445.5" y2="254.0" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<line x1="454.5" y1="236.0" x2="454.5" y2="254.0" stroke="#222" stroke-width="3" stroke-linecap="round"/>
<text x="450" y="273" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">C0</text>
<text x="450" y="140" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1a6fd4">series R-L-C (the crystal's mechanical resonance)</text>
<text x="450" y="293" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#d1342f">shunt capacitance (electrodes + stray), in parallel</text>
<text x="790" y="112" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">Piezoelectricity works</text>
<text x="790" y="130" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">in both directions</text>
<rect x="755.0" y="160.0" width="70.0" height="34.0" rx="0" fill="#f6f0d8" stroke="#222" stroke-width="1.5"/>
<line x1="728.0" y1="177.0" x2="752.0" y2="177.0" stroke="#d1342f" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="752.0,177.0 743.7,180.5 743.7,173.5" fill="#d1342f"/>
<line x1="852.0" y1="177.0" x2="828.0" y2="177.0" stroke="#d1342f" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="828.0,177.0 836.3,173.5 836.3,180.5" fill="#d1342f"/>
<text x="790" y="218" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#d1342f">squeeze → voltage</text>
<text x="790" y="236" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1a6fd4">voltage → flexes</text>
<text x="790" y="262" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">(the piezoelectric effect itself is</text>
<text x="790" y="279" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">deformation from applied voltage)</text>
</svg>
