<text x="397" y="173.768115942029" font-size="12.5" text-anchor="end" font-weight="normal" fill="#d1342f">(13.8 − 5) × 1 A = 8.8 W</text>
<text x="397" y="273.768115942029" font-size="12.5" text-anchor="end" font-weight="normal" fill="#2e8b57">5 V × 1 A = 5 W</text>
<text x="450.0" y="97" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">13.8 V × 1 A = 13.8 W in</text>
<text x="450" y="335" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">P = (Vin − Vout) × Iout</text>
<text x="450" y="353" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">why linear regulators run hot</text>
