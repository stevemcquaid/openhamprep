<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="900" height="380" rx="10" fill="#fff" stroke="#ccc"/>
<text x="450.0" y="28" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">RF semiconductor materials and package types</text>
<text x="150" y="62" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">Higher frequency capability</text>
<rect x="40.0" y="100.0" width="240.0" height="62.0" rx="8" fill="#d1342f" stroke="#d1342f" stroke-width="1"/>
<text x="160" y="126" font-size="14" text-anchor="middle" font-weight="bold" fill="#fff">Gallium nitride (GaN)</text>
<text x="160" y="146" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#fff">highest-frequency MMICs</text>
<rect x="40.0" y="180.0" width="240.0" height="62.0" rx="8" fill="#c98a00" stroke="#c98a00" stroke-width="1"/>
<text x="160" y="206" font-size="14" text-anchor="middle" font-weight="bold" fill="#fff">Gallium arsenide (GaAs)</text>
<text x="160" y="226" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#fff">higher electron mobility: UHF, microwave</text>
<rect x="40.0" y="260.0" width="240.0" height="62.0" rx="8" fill="#1a6fd4" stroke="#1a6fd4" stroke-width="1"/>
<text x="160" y="286" font-size="14" text-anchor="middle" font-weight="bold" fill="#fff">Silicon (Si)</text>
<text x="160" y="306" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#fff">general purpose, lower frequency</text>
<line x1="305.0" y1="320.0" x2="305.0" y2="100.0" stroke="#999" stroke-width="3" stroke-linecap="round"/>
<polygon points="305.0,100.0 308.5,108.3 301.5,108.3" fill="#999"/>
<line x1="340.0" y1="50.0" x2="340.0" y2="355.0" stroke="#e5e5e5" stroke-width="1" stroke-linecap="round"/>
<text x="620" y="62" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">Package lead length at UHF and above</text>
<rect x="400.0" y="220.0" width="140.0" height="18.0" rx="0" fill="#cfe9d4" stroke="#2e8b57" stroke-width="1.5"/>
<rect x="425.0" y="150.0" width="90.0" height="40.0" rx="3" fill="#333" stroke="#111" stroke-width="1"/>
<line x1="435.0" y1="190.0" x2="435.0" y2="262.0" stroke="#999" stroke-width="3" stroke-linecap="round"/>
<line x1="458.0" y1="190.0" x2="458.0" y2="262.0" stroke="#999" stroke-width="3" stroke-linecap="round"/>
<line x1="482.0" y1="190.0" x2="482.0" y2="262.0" stroke="#999" stroke-width="3" stroke-linecap="round"/>
<line x1="505.0" y1="190.0" x2="505.0" y2="262.0" stroke="#999" stroke-width="3" stroke-linecap="round"/>
<text x="470" y="285" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#d1342f">long leads → parasitic L and C:</text>
<text x="470" y="302" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#d1342f">poor performance above UHF</text>
<text x="470" y="130" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">excessive lead length</text>
<text x="470" y="340" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">DIP (through-hole)</text>
<rect x="670.0" y="220.0" width="140.0" height="18.0" rx="0" fill="#cfe9d4" stroke="#2e8b57" stroke-width="1.5"/>
<rect x="695.0" y="182.0" width="90.0" height="34.0" rx="3" fill="#333" stroke="#111" stroke-width="1"/>
<rect x="690.0" y="214.0" width="10.0" height="6.0" rx="0" fill="#999" stroke="#999" stroke-width="1"/>
<rect x="710.0" y="214.0" width="10.0" height="6.0" rx="0" fill="#999" stroke="#999" stroke-width="1"/>
<rect x="760.0" y="214.0" width="10.0" height="6.0" rx="0" fill="#999" stroke="#999" stroke-width="1"/>
<rect x="780.0" y="214.0" width="10.0" height="6.0" rx="0" fill="#999" stroke="#999" stroke-width="1"/>
<text x="740" y="285" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#2e8b57">short leads, smaller area,</text>
<text x="740" y="302" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#2e8b57">least parasitics above HF</text>
<text x="740" y="140" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">shorter traces</text>
<text x="740" y="340" font-size="13" text-anchor="middle" font-weight="bold" fill="#222">Surface-mount</text>
</svg>
