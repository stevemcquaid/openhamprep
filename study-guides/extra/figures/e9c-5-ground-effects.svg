<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="900" height="330" rx="10" fill="#fff" stroke="#ccc"/>
<text x="450" y="28" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">Ground effects (side view, schematic)</text>
<text x="150" y="60" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">Higher horizontal antenna →</text>
<text x="150" y="78" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">lower takeoff angle</text>
<line x1="20.0" y1="270.0" x2="285.0" y2="270.0" stroke="#8a6d3b" stroke-width="4" stroke-linecap="round"/>
<line x1="85.0" y1="270.0" x2="85.0" y2="232.0" stroke="#999" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/>
<circle cx="85" cy="232" r="6" fill="#d1342f"/>
<line x1="85.0" y1="232.0" x2="137.3" y2="165.0" stroke="#1a6fd4" stroke-width="3" stroke-linecap="round"/><polygon points="137.3,165.0 128.6,169.9 134.7,174.7" fill="#1a6fd4"/>
<text x="85" y="292" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">low antenna</text>
<line x1="215.0" y1="270.0" x2="215.0" y2="170.0" stroke="#999" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/>
<circle cx="215" cy="170" r="6" fill="#d1342f"/>
<line x1="215.0" y1="170.0" x2="293.8" y2="138.2" stroke="#1a6fd4" stroke-width="3" stroke-linecap="round"/><polygon points="293.8,138.2 283.8,138.0 286.7,145.2" fill="#1a6fd4"/>
<text x="215" y="292" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">high antenna</text>
<text x="150" y="316" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999" font-style="italic">(angles illustrative)</text>
<text x="445" y="60" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">Downhill slope in front →</text>
<text x="445" y="78" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">takeoff angle decreases further</text>
<polygon points="315.0,208.0 385.0,208.0 585.0,270.0 585.0,290.0 315.0,290.0" fill="#efe6d2" stroke="#8a6d3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="365.0" y1="208.0" x2="365.0" y2="170.0" stroke="#999" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/>
<circle cx="365" cy="170" r="6" fill="#d1342f"/>
<line x1="365.0" y1="170.0" x2="430.1" y2="115.4" stroke="#999" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><polygon points="430.1,115.4 420.6,118.3 425.6,124.3" fill="#999"/>
<line x1="365.0" y1="170.0" x2="457.7" y2="132.5" stroke="#1a6fd4" stroke-width="3" stroke-linecap="round"/><polygon points="457.7,132.5 447.7,132.4 450.6,139.6" fill="#1a6fd4"/>
<text x="435" y="108" font-size="12.5" text-anchor="start" font-weight="normal" fill="#999">flat ground (higher)</text>
<text x="465" y="148" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a6fd4">downhill (lower)</text>
<text x="740" y="60" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">Vertical antenna over seawater →</text>
<text x="740" y="78" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">more low-angle radiation</text>
<rect x="610" y="270" width="270" height="20" fill="#cfe4f7" stroke="#1a6fd4"/>
<text x="745" y="285" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1a6fd4">seawater (excellent ground)</text>
<line x1="745.0" y1="270.0" x2="745.0" y2="180.0" stroke="#d1342f" stroke-width="4" stroke-linecap="round"/>
<line x1="745.0" y1="186.0" x2="862.5" y2="143.2" stroke="#1a6fd4" stroke-width="3" stroke-linecap="round"/><polygon points="862.5,143.2 852.5,142.7 855.1,150.1" fill="#1a6fd4"/>
<line x1="745.0" y1="186.0" x2="798.6" y2="141.0" stroke="#999" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><polygon points="798.6,141.0 789.1,143.9 794.1,149.9" fill="#999"/>
<text x="875" y="204" font-size="12.5" text-anchor="end" font-weight="normal" fill="#1a6fd4">seawater: strong</text>
<text x="875" y="218" font-size="12.5" text-anchor="end" font-weight="normal" fill="#1a6fd4">low-angle lobe</text>
<text x="797" y="130" font-size="12.5" text-anchor="end" font-weight="normal" fill="#999">soil (dashed): weaker, higher angle</text>
</svg>
