<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="900" height="400" rx="10" fill="#fff" stroke="#ccc"/>
<text x="450.0" y="28" font-size="16" text-anchor="middle" font-weight="bold" fill="#222">Generating FM/PM with a reactance modulator, and SSB with the filter method</text>
<text x="215" y="60" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">Reactance modulation (FM / PM)</text>
<text x="215" y="78" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">audio varies a capacitance in the oscillator</text>
<rect x="20.0" y="110.0" width="100.0" height="50.0" rx="6" fill="#fafafa" stroke="#222" stroke-width="2"/>
<text x="70.0" y="139.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222">audio in</text>
<line x1="120.0" y1="135.0" x2="160.0" y2="135.0" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<polygon points="160.0,135.0 151.7,138.5 151.7,131.5" fill="#222"/>
<rect x="160.0" y="110.0" width="130.0" height="50.0" rx="6" fill="#fff4d6" stroke="#c98a00" stroke-width="2"/>
<text x="225.0" y="131.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222">reactance</text>
<text x="225.0" y="147.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">modulator</text>
<line x1="290.0" y1="135.0" x2="330.0" y2="135.0" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<polygon points="330.0,135.0 321.7,138.5 321.7,131.5" fill="#222"/>
<rect x="330.0" y="110.0" width="90.0" height="50.0" rx="6" fill="#dce9fb" stroke="#1a6fd4" stroke-width="2"/>
<text x="375.0" y="139.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222">oscillator</text>
<text x="225" y="196" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">varying capacitance shifts the oscillator</text>
<text x="225" y="213" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">frequency in step with the audio</text>
<rect x="20.0" y="250.0" width="150.0" height="50.0" rx="6" fill="#e3f3ea" stroke="#2e8b57" stroke-width="2"/>
<text x="95.0" y="271.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222">frequency</text>
<text x="95.0" y="287.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">discriminator</text>
<text x="190" y="280" font-size="12.5" text-anchor="start" font-weight="normal" fill="#999">← detects FM on receive</text>
<text x="215" y="340" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">FM transmitters: pre-emphasis boosts highs;</text>
<text x="215" y="357" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">receiver de-emphasis restores them</text>
<line x1="450.0" y1="50.0" x2="450.0" y2="385.0" stroke="#e5e5e5" stroke-width="1" stroke-linecap="round"/>
<text x="675" y="60" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">SSB: balanced modulator + filter</text>
<text x="675" y="78" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">make two sidebands, strip one</text>
<rect x="470.0" y="100.0" width="90.0" height="50.0" rx="6" fill="#fafafa" stroke="#222" stroke-width="2"/>
<text x="515.0" y="121.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222">carrier</text>
<text x="515.0" y="137.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">+ audio</text>
<line x1="560.0" y1="125.0" x2="590.0" y2="125.0" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<polygon points="590.0,125.0 581.7,128.5 581.7,121.5" fill="#222"/>
<rect x="590.0" y="100.0" width="100.0" height="50.0" rx="6" fill="#fff4d6" stroke="#c98a00" stroke-width="2"/>
<text x="640.0" y="121.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222">balanced</text>
<text x="640.0" y="137.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">modulator</text>
<line x1="690.0" y1="125.0" x2="720.0" y2="125.0" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<polygon points="720.0,125.0 711.7,128.5 711.7,121.5" fill="#222"/>
<rect x="720.0" y="100.0" width="90.0" height="50.0" rx="6" fill="#dce9fb" stroke="#1a6fd4" stroke-width="2"/>
<text x="765.0" y="121.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222">sideband</text>
<text x="765.0" y="137.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">filter</text>
<line x1="810.0" y1="125.0" x2="840.0" y2="125.0" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<polygon points="840.0,125.0 831.7,128.5 831.7,121.5" fill="#222"/>
<text x="845" y="130" font-size="13" text-anchor="start" font-weight="bold" fill="#222">SSB</text>
<line x1="475.0" y1="290.0" x2="665.0" y2="290.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
<text x="570.0" y="190" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222">after balanced modulator</text>
<text x="665" y="308" font-size="12.5" text-anchor="end" font-weight="normal" fill="#999">frequency →</text>
<line x1="570.0" y1="290.0" x2="570.0" y2="230.0" stroke="#999" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="570.0" y="308" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">fc</text>
<line x1="525.0" y1="290.0" x2="525.0" y2="235.0" stroke="#1a6fd4" stroke-width="3.5" stroke-linecap="round"/>
<line x1="615.0" y1="290.0" x2="615.0" y2="235.0" stroke="#1a6fd4" stroke-width="3.5" stroke-linecap="round"/>
<text x="570.0" y="200" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">carrier suppressed (dashed)</text>
<text x="570.0" y="216" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1a6fd4">two sidebands remain</text>
<line x1="695.0" y1="290.0" x2="885.0" y2="290.0" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
<text x="790.0" y="190" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#222">after filter</text>
<text x="885" y="308" font-size="12.5" text-anchor="end" font-weight="normal" fill="#999">frequency →</text>
<line x1="790.0" y1="290.0" x2="790.0" y2="230.0" stroke="#999" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="790.0" y="308" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">fc</text>
<line x1="745.0" y1="290.0" x2="745.0" y2="235.0" stroke="#ddd" stroke-width="3.5" stroke-linecap="round"/>
<line x1="835.0" y1="290.0" x2="835.0" y2="235.0" stroke="#1a6fd4" stroke-width="3.5" stroke-linecap="round"/>
<rect x="810.0" y="222.0" width="50.0" height="68.0" rx="0" fill="none" stroke="#2e8b57" stroke-width="1.8" stroke-dasharray="4 3"/>
<text x="790.0" y="200" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#2e8b57">filter passes one sideband</text>
<text x="790.0" y="216" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">(the other is removed)</text>
<text x="675" y="360" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">SSB phone is demodulated with a product detector</text>
</svg>
