<polyline points="370.0,250.0 124.0,253.0 118.0,254.0 117.7,263.0 117.3,272.0 117.0,281.0 116.6,290.0 116.3,299.0 115.9,308.0 115.6,317.0 115.2,326.0 114.9,335.0 114.5,344.0 114.2,353.0" fill="none" stroke="#d1342f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="482" y="132" font-size="12.5" text-anchor="start" font-weight="bold" fill="#1a6fd4">silicon junction diode</text>
<text x="482" y="148" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a6fd4">knee ≈ 0.6 – 0.7 V</text>
<text x="422" y="226" font-size="12.5" text-anchor="start" font-weight="bold" fill="#2e8b57">Schottky: lower</text>
<text x="422" y="242" font-size="12.5" text-anchor="start" font-weight="normal" fill="#2e8b57">forward drop</text>
<text x="132.00000000000003" y="312" font-size="12.5" text-anchor="start" font-weight="bold" fill="#d1342f">Zener breakdown: voltage stays</text>
<text x="132.00000000000003" y="328" font-size="12.5" text-anchor="start" font-weight="normal" fill="#d1342f">≈ constant as current varies</text>
<rect x="650.0" y="70.0" width="230.0" height="262.0" rx="8" fill="#fafafa" stroke="#ddd" stroke-width="1.5"/>
<text x="770" y="98" font-size="14" text-anchor="middle" font-weight="bold" fill="#222">Remember</text>
<text x="664" y="128" font-size="13" text-anchor="start" font-weight="bold" fill="#d1342f">Zener</text>
<text x="664" y="145" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">voltage reference</text>
<text x="664" y="178" font-size="13" text-anchor="start" font-weight="bold" fill="#2e8b57">Schottky</text>
<text x="664" y="195" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">metal–semiconductor junction;</text>
<text x="664" y="212" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">lower forward drop → power</text>
<text x="664" y="229" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">rectifier, VHF/UHF mixer,</text>
<text x="664" y="246" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">detector</text>
<text x="664" y="276" font-size="13" text-anchor="start" font-weight="bold" fill="#222">Point-contact</text>
<text x="664" y="293" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">low capacitance → RF detector</text>
<text x="664" y="320" font-size="12.5" text-anchor="start" font-weight="normal" fill="#999">Failure: excess junction temp.</text>
<text x="450.0" y="368" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999" font-style="italic">Schematic curves (not to scale). Axes cross at zero volts and zero current.</text>
</svg>
