<text x="812" y="210.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#222">threshold</text>
<text x="760" y="332" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222">noise must swing a long way to flip it</text>
<text x="760" y="350" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">CMOS: lowest power</text>
<text x="760" y="366" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">BiCMOS: CMOS input Z + bipolar drive</text>
