<text x="450" y="80" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#999">no floating inputs</text>
<line x1="390.0" y1="110.0" x2="510.0" y2="110.0" stroke="#d1342f" stroke-width="3" stroke-linecap="round"/>
